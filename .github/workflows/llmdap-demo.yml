name: LLMDAP

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button: also makes a real model call
    inputs:
      prompt:
        description: Prompt to send
        default: In one sentence, what problem does LDAP solve?

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (includes schema check of examples/directory.json)
        run: pip install -q pytest jsonschema && PYTHONPATH=clients/python/src pytest -q clients/python/tests

  live-demo:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read   # lets the built-in GITHUB_TOKEN call GitHub Models for free
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up chat-github over HTTPS, then call GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRECTORY: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/examples/directory.json
        run: |
          python examples/demo.py -d "$DIRECTORY" -s chat-github "${{ inputs.prompt }}" | tee reply.txt
          { echo "### Reply from chat-github"; echo; cat reply.txt; } >> "$GITHUB_STEP_SUMMARY"
