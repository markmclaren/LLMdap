services:
  demo:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python3", "examples/free-tier/demo.py"]
    command: ["--list"]

  demo-local:
    image: python:3.12-slim
    profiles: ["local"]
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    models:
      chat:
        endpoint_var: DMR_URL
        model_var: DMR_MODEL
    entrypoint:
      - /bin/sh
      - -c
      - |
        export LLMDAP_OVERRIDE_CHAT_DMR="$$(python3 -c 'import json,os; print(json.dumps({"endpoint":os.environ["DMR_URL"],"dialect":"openai-chat","model":os.environ["DMR_MODEL"],"auth":{"method":"none"},"governance":{"data_classification":"restricted","zero_data_retention":true,"region":"on-prem"}}))')"
        exec python3 examples/free-tier/demo.py -s chat-dmr "$$@"
      - --
    command: ["In one sentence, what problem does LDAP solve?"]

models:
  chat:
    model: ai/smollm2
