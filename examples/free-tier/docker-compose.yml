services:
  demo:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python3", "examples/free-tier/demo.py"]
    command: ["--list"]

